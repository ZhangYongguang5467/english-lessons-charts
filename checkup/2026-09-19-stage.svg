<text x="60" y="68" font-size="13.5" fill="#52514e">维度 = CEFR 口语评分表的五项(Range / Accuracy / Fluency / Interaction / Coherence)。</text>
<text x="60" y="88" font-size="13.5" fill="#52514e">条长 = 该维度各指标达到 B2 门槛的比例(100 = 到达 B2 线);右侧 = 已达成的 B2 标准条数。</text>
<text x="60" y="108" font-size="13.5" fill="#52514e">阶段规则:B2 标准全部达成 = B2;达成一半以上 = B1+;不足一半 = B1。门槛来自 scripts/speech_trends.py。</text>
